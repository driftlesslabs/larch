name: larch release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:

  pypi-publish:
    name: upload release to PyPI
    runs-on: ubuntu-latest
    # Specifying a GitHub environment is optional, but strongly encouraged
    environment: release
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.13.4"
          enable-cache: false
      - name: Build wheel
        run: |
          # Upgrade pip with uv, not with the runner's older pip, which trusts the
          # compromised eMudhra CA (see the eMudhra note in pyproject.toml).
          uv pip install --system "pip>=26.2.2"
          python tools/rip_examples.py
          python -m pip install build
          python -m build .
      - uses: actions/upload-artifact@v4
        with:
          name: release-wheels
          path: dist
      - name: Test wheel
        run: |
          echo "=== Setting up venv ==="
          uv venv
          source .venv/bin/activate
          echo "=== Checking file in dist ==="
          ls dist
          echo "=== Installing wheel ==="
          uv pip install dist/*.whl
          echo "=== Testing larch and sharrow imports ==="
          python -c "import larch"
          python -c "import sharrow"
      - name: Publish package distributions to PyPI
        if: github.event_name == 'release'
        uses: pypa/gh-action-pypi-publish@release/v1
