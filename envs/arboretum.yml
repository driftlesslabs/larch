# a minimal environment for larch v6
name: arboretum
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  # eMudhra CA incident: pip and certifi versions that drop the compromised CA
  - pip>=26.2.2
  - certifi>=2026.10.19
  - addicty
  - dask
  - filelock
  - jupyterlab
  - networkx
  - numba >= 0.51.2
  - numexpr
  - numpy >= 1.19
  - pandas >= 2.0
  - pyarrow
  - rich
  - scipy
  - sharrow >= 2.12
  - sparse
  - tbb
  - xarray
  - xmle
  - pip:
      - jax
      - larch
